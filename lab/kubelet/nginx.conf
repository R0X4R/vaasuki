events {}
http {
    server {
        listen 10250 ssl;
        listen 10255;

        ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        location /pods {
            default_type application/json;
            return 200 '{"kind":"PodList","apiVersion":"v1","items":[{"metadata":{"name":"kubelet-monitored-pod-1","namespace":"default"},"spec":{"containers":[{"name":"worker-agent","image":"busybox"}]}}]}';
        }

        location /stats/summary {
            default_type application/json;
            return 200 '{"node":{"nodeName":"lab-worker-node-1","systemInfo":{"machineID":"abc123xyz"}},"pods":[]}';
        }
    }
}
