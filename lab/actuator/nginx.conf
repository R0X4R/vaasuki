events {}
http {
    server {
        listen 8080;

        location /actuator/health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        location /actuator/env {
            default_type application/json;
            return 200 '{"activeProfiles":["dev"],"propertySources":[{"name":"systemProperties","properties":{"java.runtime.version":{"value":"17.0.8+7"}}}]}';
        }

        location /actuator/mappings {
            default_type application/json;
            return 200 '{"contexts":{"application":{"mappings":{"dispatcherServlets":{"dispatcherServlet":[{"handler":"com.example.controller.ApiController","predicate":"{GET [/api/data]}"}]}}}}}';
        }

        location /actuator/heapdump {
            default_type application/octet-stream;
            return 200 'JAVA PROFILE 1.0.2 DUMP';
        }
    }
}
