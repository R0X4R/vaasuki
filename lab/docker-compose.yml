services:
  # ============================================================================
  # 1. FTP Services (Vulnerable vs Hardened)
  # ============================================================================
  ftp-vuln:
    build:
      context: ./ftp
      dockerfile: Dockerfile
      args:
        CONF_FILE: vsftpd-anon.conf
    container_name: vaasuki-ftp-vuln
    ports:
      - "2121:21"
      - "21100-21105:21100-21105"
    restart: unless-stopped

  ftp-hardened:
    build:
      context: ./ftp
      dockerfile: Dockerfile
      args:
        CONF_FILE: vsftpd-hardened.conf
    container_name: vaasuki-ftp-hardened
    ports:
      - "2122:21"
      - "21110-21115:21110-21115"
    restart: unless-stopped

  # ============================================================================
  # 2. Telnet Service
  # ============================================================================
  telnet-vuln:
    build:
      context: ./telnet
      dockerfile: Dockerfile
    container_name: vaasuki-telnet-vuln
    ports:
      - "2323:23"
    restart: unless-stopped

  # ============================================================================
  # 3. SMB / Samba Service (Guest Public Share)
  # ============================================================================
  smb-vuln:
    build:
      context: ./samba
      dockerfile: Dockerfile
    container_name: vaasuki-smb-vuln
    ports:
      - "4445:445"
    restart: unless-stopped

  # ============================================================================
  # 4. Redis Services (Unauthenticated vs Requirepass)
  # ============================================================================
  redis-vuln:
    image: redis:7-alpine
    container_name: vaasuki-redis-vuln
    command: ["redis-server", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  redis-hardened:
    image: redis:7-alpine
    container_name: vaasuki-redis-hardened
    command: ["redis-server", "--requirepass", "labpassword123", "--protected-mode", "yes"]
    ports:
      - "6380:6379"
    restart: unless-stopped

  # ============================================================================
  # 5. MongoDB Services (Unauthenticated vs Auth Required)
  # ============================================================================
  mongo-vuln:
    image: mongo:7.0
    container_name: vaasuki-mongo-vuln
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    restart: unless-stopped

  mongo-hardened:
    image: mongo:7.0
    container_name: vaasuki-mongo-hardened
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword123
    ports:
      - "27018:27017"
    restart: unless-stopped

  # ============================================================================
  # 6. Elasticsearch (Unauthenticated single-node)
  # ============================================================================
  elasticsearch-vuln:
    image: elasticsearch:7.17.18
    container_name: vaasuki-elastic-vuln
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    restart: unless-stopped

  # ============================================================================
  # 7. Memcached Service (Unauthenticated stats)
  # ============================================================================
  memcached-vuln:
    image: memcached:alpine
    container_name: vaasuki-memcached-vuln
    ports:
      - "11211:11211"
    restart: unless-stopped

  # ============================================================================
  # 8. Exposed Docker API Mock (Port 2375)
  # ============================================================================
  docker-api-vuln:
    image: nginx:alpine
    container_name: vaasuki-docker-api-vuln
    volumes:
      - ./docker-api/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "2375:2375"
    restart: unless-stopped

  # ============================================================================
  # 9. etcd Key-Value Store (Unauthenticated v3)
  # ============================================================================
  etcd-vuln:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: vaasuki-etcd-vuln
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    restart: unless-stopped

  # ============================================================================
  # 10. HashiCorp Consul (Unauthenticated Dev Agent)
  # ============================================================================
  consul-vuln:
    image: hashicorp/consul:1.18
    container_name: vaasuki-consul-vuln
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports:
      - "8500:8500"
    restart: unless-stopped

  # ============================================================================
  # 11. LDAP Directory Service (Anonymous Bind)
  # ============================================================================
  ldap-vuln:
    image: rroemhild/test-openldap:latest
    container_name: vaasuki-ldap-vuln
    ports:
      - "3890:10389"
    restart: unless-stopped

  # ============================================================================
  # 12. SMTP Mock Service (Mailpit - Safe Relay & STARTTLS Testing)
  # ============================================================================
  smtp-vuln:
    image: axllent/mailpit:latest
    container_name: vaasuki-smtp-vuln
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI
    restart: unless-stopped

  # ============================================================================
  # 13. DNS Service (CoreDNS with CHAOS version & recursion)
  # ============================================================================
  dns-vuln:
    image: coredns/coredns:latest
    container_name: vaasuki-dns-vuln
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "5354:53/udp"
      - "5354:53/tcp"
    restart: unless-stopped

  # ============================================================================
  # 14. Message Broker (RabbitMQ Management)
  # ============================================================================
  rabbitmq-vuln:
    image: rabbitmq:3.13-management-alpine
    container_name: vaasuki-rabbitmq-vuln
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management Web UI
    restart: unless-stopped

  # ============================================================================
  # 15. Monitoring & Metrics (Prometheus Unauthenticated)
  # ============================================================================
  prometheus-vuln:
    image: prom/prometheus:latest
    container_name: vaasuki-prom-vuln
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ============================================================================
  # 16. Dashboard (Grafana - Anonymous Access Enabled)
  # ============================================================================
  grafana-vuln:
    image: grafana/grafana:latest
    container_name: vaasuki-grafana-vuln
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ============================================================================
  # 17. CI/CD (Jenkins Mock / Service)
  # ============================================================================
  jenkins-vuln:
    image: jenkins/jenkins:lts-alpine
    container_name: vaasuki-jenkins-vuln
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ============================================================================
  # 18. Generic Web Admin Portal
  # ============================================================================
  http-admin:
    image: nginx:alpine
    container_name: vaasuki-http-admin
    ports:
      - "8088:80"
    restart: unless-stopped

  # ============================================================================
  # 19. Kubernetes API Server Mock (Port 6443 HTTPS, 8443 HTTP)
  # ============================================================================
  k8s-api-vuln:
    build:
      context: ./k8s
      dockerfile: Dockerfile
    container_name: vaasuki-k8s-api-vuln
    ports:
      - "6443:6443"
      - "8443:8443"
    restart: unless-stopped

  # ============================================================================
  # 20. Kubelet API Mock (Port 10250 HTTPS, 10255 HTTP)
  # ============================================================================
  kubelet-vuln:
    build:
      context: ./kubelet
      dockerfile: Dockerfile
    container_name: vaasuki-kubelet-vuln
    ports:
      - "10250:10250"
      - "10255:10255"
    restart: unless-stopped

  # ============================================================================
  # 21. Docker Registry v2 (Port 5000)
  # ============================================================================
  registry-vuln:
    image: registry:2
    container_name: vaasuki-registry-vuln
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ============================================================================
  # 22. Apache ZooKeeper (Port 2181, 4LW enabled)
  # ============================================================================
  zookeeper-vuln:
    image: zookeeper:3.9
    container_name: vaasuki-zookeeper-vuln
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    ports:
      - "2181:2181"
    restart: unless-stopped

  # ============================================================================
  # 23. Apache Kafka (Port 9092, KRaft mode single-node)
  # ============================================================================
  kafka-vuln:
    image: apache/kafka:3.7.0
    container_name: vaasuki-kafka-vuln
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "9092:9092"
    restart: unless-stopped

  # ============================================================================
  # 24. Apache ActiveMQ (Port 8161 Web Console, 61616 OpenWire)
  # ============================================================================
  activemq-vuln:
    image: apache/activemq-classic:latest
    container_name: vaasuki-activemq-vuln
    ports:
      - "8161:8161"
      - "61616:61616"
    restart: unless-stopped

  # ============================================================================
  # 25. Apache CouchDB (Port 5984)
  # ============================================================================
  couchdb-vuln:
    image: couchdb:3
    container_name: vaasuki-couchdb-vuln
    environment:
      - NODENAME=couchdb
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    restart: unless-stopped

  # ============================================================================
  # 26. InfluxDB (Port 8086, Unauthenticated HTTP query)
  # ============================================================================
  influxdb-vuln:
    image: influxdb:1.8-alpine
    container_name: vaasuki-influxdb-vuln
    ports:
      - "8086:8086"
    restart: unless-stopped

  # ============================================================================
  # 27. Neo4j Graph Database (Port 7474 HTTP, 7687 Bolt, Auth Disabled)
  # ============================================================================
  neo4j-vuln:
    image: neo4j:5-community
    container_name: vaasuki-neo4j-vuln
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

  # ============================================================================
  # 28. ClickHouse Database (Port 8123 HTTP, 9001 Native)
  # ============================================================================
  clickhouse-vuln:
    image: clickhouse/clickhouse-server:latest
    container_name: vaasuki-clickhouse-vuln
    ports:
      - "8123:8123"
      - "9001:9000"
    restart: unless-stopped

  # ============================================================================
  # 29. Hadoop HDFS NameNode Mock (Port 9870 WebHDFS)
  # ============================================================================
  hadoop-vuln:
    image: nginx:alpine
    container_name: vaasuki-hadoop-vuln
    volumes:
      - ./hadoop/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9870:9870"
    restart: unless-stopped

  # ============================================================================
  # 30. Apache Solr Mock (Port 8983)
  # ============================================================================
  solr-vuln:
    image: nginx:alpine
    container_name: vaasuki-solr-vuln
    volumes:
      - ./solr/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8983:8983"
    restart: unless-stopped

  # ============================================================================
  # 31. Kibana Mock (Port 5601)
  # ============================================================================
  kibana-vuln:
    image: nginx:alpine
    container_name: vaasuki-kibana-vuln
    volumes:
      - ./kibana/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5601:5601"
    restart: unless-stopped

  # ============================================================================
  # 32. Spring Boot Actuator Mock (Port 8081 -> 8080)
  # ============================================================================
  actuator-vuln:
    image: nginx:alpine
    container_name: vaasuki-actuator-vuln
    volumes:
      - ./actuator/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

  # ============================================================================
  # 33. PHP-FPM / FastCGI (Port 9000)
  # ============================================================================
  php-fpm-vuln:
    image: php:8-fpm-alpine
    container_name: vaasuki-php-fpm-vuln
    ports:
      - "9000:9000"
    restart: unless-stopped

  # ============================================================================
  # 34. JDWP Debug Mock (Port 8000)
  # ============================================================================
  jdwp-vuln:
    build:
      context: ./jdwp
      dockerfile: Dockerfile
    container_name: vaasuki-jdwp-vuln
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ============================================================================
  # 35. VNC Server Mock (Port 5900, Security Type None)
  # ============================================================================
  vnc-vuln:
    build:
      context: ./vnc
      dockerfile: Dockerfile
    container_name: vaasuki-vnc-vuln
    ports:
      - "5900:5900"
    restart: unless-stopped

  # ============================================================================
  # 36. rsync Daemon (Port 873, Anonymous Module)
  # ============================================================================
  rsync-vuln:
    build:
      context: ./rsync
      dockerfile: Dockerfile
    container_name: vaasuki-rsync-vuln
    ports:
      - "873:873"
    restart: unless-stopped

  # ============================================================================
  # 37. SNMP Daemon (Port 161/UDP, Community 'public')
  # ============================================================================
  snmp-vuln:
    build:
      context: ./snmp
      dockerfile: Dockerfile
    container_name: vaasuki-snmp-vuln
    ports:
      - "161:161/udp"
    restart: unless-stopped
